name: fonogramma

services:
  app:
    build: ./server
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - ACCESS_PIN=${ACCESS_PIN:-}
      - DATA_DIR=/data
    ports:
      - "127.0.0.1:${APP_PORT:-8001}:8000"
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      - app
    network_mode: host
    environment:
      - SITE_ADDRS=${SITE_ADDRS}
      - PUBLIC_ADDRS=${PUBLIC_ADDRS:-}
      - HTTP_PORT=${HTTP_PORT:-80}
      - HTTPS_PORT=${HTTPS_PORT:-443}
      - APP_PORT=${APP_PORT:-8001}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
      # certificati pubblici *.ts.net forniti da Tailscale (MagicDNS)
      - /var/run/tailscale:/var/run/tailscale
