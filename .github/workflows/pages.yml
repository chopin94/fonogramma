# Verifica gli algoritmi con i test e pubblica la PWA (cartella web/) su GitHub Pages
# a ogni push su main. Se un test fallisce, la pubblicazione non avviene.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'tests/**', 'tools/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['web/**', 'tests/**', 'tools/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # elenco dei file offline e versione della cache = commit: i dispositivi si aggiornano
      - run: node tools/build-sw.mjs "${GITHUB_SHA::10}"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
