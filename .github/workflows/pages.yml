# Pubblica la PWA (cartella web/) su GitHub Pages a ogni push su main.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # versione del service worker = commit: i dispositivi ricevono gli aggiornamenti
      - run: sed -i "s/^const VERSION = .*/const VERSION = 'fonogramma-${GITHUB_SHA::10}';/" web/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
