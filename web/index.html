<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fonogramma</title>
  <meta name="description" content="Auscultazione digitale cardiaca e polmonare con fonendoscopio collegato via jack">
  <meta name="theme-color" content="#0a0f1c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('fonogramma.settings.v1') || '{}');
      var t = s.theme || 'auto';
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#/"><img src="icons/icon.svg" alt=""><span>Fonogramma<small>auscultazione digitale</small></span></a>
      <div class="ctx-chip">
        <button class="sync-chip" id="sync-chip" title="Sincronizzazione con il server di casa"><span class="dot"></span><span class="lbl">…</span></button>
      </div>
    </header>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="home"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5l9-8 9 8M5 10v10.5h14V10M10 20.5v-6h4v6"/></svg>Home</a>
      <a href="#/live" data-nav="live" class="cta"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v5.5a5 5 0 0 0 10 0V3M10 13.5V16a4.5 4.5 0 0 0 9 0v-3M19 13a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4z"/></svg>Ausculta</a>
      <a href="#/patients" data-nav="patients"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18v12.5H3zM1.5 3.5h21V8h-21zM10 12.5h4"/></svg>Archivio</a>
      <a href="#/settings" data-nav="settings"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1.5 14h5M9.5 8h5M17.5 16h5"/></svg>Impostazioni</a>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="toasts"></div>
  <div id="sheet-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
